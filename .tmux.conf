# tmux config for colibri-agent

# Prefix: Ctrl+Space instead of Ctrl+B (frees Ctrl+A for readline)
set -g prefix C-Space
unbind C-b
bind C-Space send-prefix

# Mouse: scroll, resize panes, select
set -g mouse on

# 256 colors
set -g default-terminal "screen-256color"

# Faster input response
set -sg escape-time 0

# History limit
set -g history-limit 50000